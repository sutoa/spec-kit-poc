openapi: 3.0.3
info:
  title: Account Reporting Utility API
  version: 1.0.0
  description: API for the Account Reporting Utility application.
paths:
  /token:
    post:
      summary: Get JWT token
      tags:
        - Auth
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string

  /users/me:
    get:
      summary: Get current user
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /dashboard:
    get:
      summary: Get dashboard data
      tags:
        - Dashboard
      security:
        - bearerAuth: []
      parameters:
        - name: as_of_date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'

  /connections:
    get:
      summary: Get all connections
      tags:
        - Connections
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'

  /connections/connect:
    post:
      summary: Initiate a new connection
      tags:
        - Connections
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                properties:
                  redirect_uri:
                    type: string

  /connections/callback:
    post:
      summary: Callback endpoint for SnapTrade
      tags:
        - Connections
      requestBody:
        content:
          application/json:
            schema:
              properties:
                authorization_id:
                  type: string
                state:
                  type: string
                  description: A secure, short-lived token (e.g., a JWT) containing the user_id to prevent CSRF attacks. The token should be generated by the backend and verified upon callback.
      responses:
        '200':
          description: Successful Response

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
    Connection:
      type: object
      properties:
        id:
          type: integer
        institution_name:
          type: string
        status:
          type: string
    Account:
      type: object
      properties:
        masked_account_number:
          type: string
        balance:
          type: number
        currency:
          type: string
        as_of_date:
          type: string
          format: date-time
    Institution:
      type: object
      properties:
        name:
          type: string
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    Dashboard:
      type: object
      properties:
        institutions:
          type: array
          items:
            $ref: '#/components/schemas/Institution'
        grand_total:
          type: number
