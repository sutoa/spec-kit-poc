openapi: 3.0.0
info:
  title: Account Viewer API
  version: 1.0.0
  description: API for the Account Viewer application.

paths:
  /api/institutions:
    get:
      summary: Get available institutions
      description: Retrieves a list of all financial institutions supported by the application.
      responses:
        '200':
          description: A list of institutions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Institution'

  /api/report:
    post:
      summary: Generate a consolidated report
      description: Generates and retrieves a report of account balances based on the provided filters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '200':
          description: The consolidated account report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          description: Invalid request parameters.

  /api/connections:
    get:
      summary: Get active connections
      description: Retrieves a list of active connections to financial institutions.
      responses:
        '200':
          description: A list of active connections.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
    post:
      summary: Create a new connection
      description: Initiates a new connection to a financial institution via the data aggregator. This returns a redirect URL for the user to authenticate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                institution_id:
                  type: string
                  description: The ID of the institution to connect to.
              required:
                - institution_id
      responses:
        '200':
          description: The URL to redirect the user to for authentication.
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect_url:
                    type: string
                    format: uri

components:
  schemas:
    Institution:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the institution.
        name:
          type: string
          description: Display name of the institution.
        logo_url:
          type: string
          format: uri
          description: URL for the institution's logo.

    ReportRequest:
      type: object
      properties:
        as_of_date:
          type: string
          format: date
          description: The date for the report.
        institution_ids:
          type: array
          items:
            type: string
          description: A list of institution IDs to include in the report.

    Report:
      type: object
      properties:
        grand_total:
          type: number
          format: double
        institutions:
          type: array
          items:
            $ref: '#/components/schemas/ReportInstitution'

    ReportInstitution:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        sub_total:
          type: number
          format: double
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/ReportAccount'
        error:
          type: string
          nullable: true
          description: An error message if data retrieval failed.

    ReportAccount:
      type: object
      properties:
        account_number_masked:
          type: string
          example: "••••1234"
        balance:
          oneOf:
            - type: number
              format: double
            - type: string
              example: "N/A"
        balance_date:
          oneOf:
            - type: string
              format: date
            - type: string
              example: "N/A"

    Connection:
      type: object
      properties:
        id:
          type: string
          description: The connection ID from the aggregator.
        institution_id:
          type: string
          description: The ID of the institution.
        status:
          type: string
          enum: [active, error, pending]
          description: The status of the connection.