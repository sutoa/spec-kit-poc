openapi: 3.0.0
info:
  title: Account Reporting API
  version: 1.0.0
paths:
  /institutions:
    get:
      summary: Get all institutions
      responses:
        '200':
          description: A list of institutions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Institution'
  /institutions/{id}/connect:
    post:
      summary: Initiate a connection to an institution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Connection initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect_uri:
                    type: string
  /dashboard:
    get:
      summary: Get dashboard data
      parameters:
        - name: as_of_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
  /snaptrade/connect:
    post:
      summary: Get a redirect URI for SnapTrade connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                institution_id:
                  type: string
      responses:
        '200':
          description: SnapTrade connection redirect URI
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect_uri:
                    type: string
  /snaptrade/callback:
    post:
      summary: Handle SnapTrade callback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                public_token:
                  type: string
      responses:
        '200':
          description: SnapTrade callback handled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
components:
  schemas:
    Institution:
      type: object
      properties:
        id:
          type: integer
        external_id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [connected, disconnected, error, pending]
    Account:
      type: object
      properties:
        id:
          type: integer
        external_id:
          type: string
        masked_account_number:
          type: string
        balance:
          type: number
        as_of_date:
          type: string
          format: date
    Dashboard:
      type: object
      properties:
        grand_total:
          type: number
        institutions:
          type: array
          items:
            type: object
            properties:
              institution:
                $ref: '#/components/schemas/Institution'
              accounts:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
              sub_total:
                type: number